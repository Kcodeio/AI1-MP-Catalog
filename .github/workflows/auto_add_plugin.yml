name: Auto Add Plugin to Catalog

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  update-catalog:
    if: contains(github.event.issue.title, 'Modül Ekleme') || contains(github.event.issue.title, 'Module')
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: catalog.json Guncelle
        run: |
          python - << 'EOF'
          import os
          import json
          import re

          issue_body = os.environ.get("ISSUE_BODY", "")
          print("--- GELEN ISSUE ICERIGI ---")
          print(issue_body)
          print("---------------------------")

          # Esnek Regex fonksiyonu
          def extract_field(pattern, default=""):
              m = re.search(pattern, issue_body, re.IGNORECASE)
              return m.group(1).strip() if m else default

          plugin_id = extract_field(r"Modül ID:[*\s`]*([a-zA-Z0-9_\-]+)")
          name = extract_field(r"İsim:[*\s]*([^\n\r]+)")
          version = extract_field(r"Sürüm:[*\s]*([0-9\.]+)", "1.0.0")
          author = extract_field(r"Geliştirici:[*\s]*([^\n\r]+)", "Topluluk")
          category = extract_field(r"Kategori:[*\s]*([^\n\r]+)", "Genel")
          description = extract_field(r"Açıklama:[*\s]*([^\n\r]+)", "")
          
          # URL'yi hem direkt linkten hem markdown linkten yakala
          url_match = re.search(r"(https?://[^\s\)\`]+)", issue_body)
          download_url = url_match.group(1).strip() if url_match else ""

          print(f"Ayıklanan ID: '{plugin_id}'")
          print(f"Ayıklanan URL: '{download_url}'")

          if not plugin_id:
              plugin_id = "custom_module_" + str(int(os.environ.get("GITHUB_RUN_NUMBER", "1")))
          
          if not download_url:
              print("HATA: Gecerli bir indirme linki bulunamadi!")
              exit(1)

          catalog_path = "catalog.json"
          catalog = []
          if os.path.exists(catalog_path):
              try:
                  with open(catalog_path, "r", encoding="utf-8") as f:
                      catalog = json.load(f)
              except Exception as e:
                  print(f"catalog.json okunamadi, sifirlaniyor: {e}")
                  catalog = []

          new_entry = {
              "id": plugin_id,
              "name": name if name else plugin_id,
              "version": version,
              "author": author,
              "category": category,
              "description": description,
              "download_url": download_url
          }

          updated = False
          for idx, item in enumerate(catalog):
              if item.get("id") == plugin_id:
                  catalog[idx] = new_entry
                  updated = True
                  break

          if not updated:
              catalog.append(new_entry)

          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(catalog, f, indent=2, ensure_ascii=False)

          print("catalog.json basariyla guncellendi!")
          EOF
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Degisiklikleri Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Auto: Plugin catalog updated" || echo "Degisiklik yok"
          git push

      - name: Issue Kapat
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🎉 **Modül başarıyla AI1 Eklenti Mağazası'na eklendi!**\nArtık tüm AI1 kullanıcıları mağazadan tek tıkla indirebilir."
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed"
            });
