name: Marketplace Catalog Manager

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  manage-catalog:
    if: contains(github.event.issue.title, 'Modül Ekleme') || contains(github.event.issue.title, 'Modül Güncelleme') || contains(github.event.issue.title, 'Modül Kaldırma')
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: catalog.json Güncelle veya Kaldır
        run: |
          python - << 'EOF'
          import os
          import json
          import re

          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")

          def extract_field(pattern, default=""):
              m = re.search(pattern, issue_body, re.IGNORECASE)
              return m.group(1).strip() if m else default

          plugin_id = extract_field(r"Modül ID:[*\s`]*([a-zA-Z0-9_\-]+)")
          name = extract_field(r"İsim:[*\s]*([^\n\r]+)")
          version = extract_field(r"Sürüm:[*\s]*([0-9\.]+)", "1.0.0")
          author = extract_field(r"Geliştirici:[*\s]*([^\n\r]+)", "Topluluk")
          category = extract_field(r"Kategori:[*\s]*([^\n\r]+)", "Genel")
          description = extract_field(r"Açıklama:[*\s]*([^\n\r]+)", "")
          
          url_match = re.search(r"(https?://[^\s\)\`]+)", issue_body)
          download_url = url_match.group(1).strip() if url_match else ""

          catalog_path = "catalog.json"
          catalog = []
          if os.path.exists(catalog_path):
              try:
                  with open(catalog_path, "r", encoding="utf-8") as f:
                      d = json.load(f)
                      catalog = d if isinstance(d, list) else []
              except Exception:
                  catalog = []

          # 1. MODÜLÜ MARKETDEN SİLME TALEBİ
          if "Modül Kaldırma" in issue_title:
              if not plugin_id:
                  print("Hata: Silinecek modül ID'si bulunamadı!")
                  exit(1)
              catalog = [item for item in catalog if item.get("id") != plugin_id]
              action_result = f"🗑️ '{plugin_id}' modülü marketten başarıyla kaldırıldı."

          # 2. YENİ VERSİYON EKLEME VEYA SIFIRDAN YÜKLEME
          else:
              if not download_url:
                  print("Hata: İndirme bağlantısı yok!")
                  exit(1)

              existing_item = next((item for item in catalog if item.get("id") == plugin_id), None)

              if existing_item:
                  existing_item["name"] = name or existing_item.get("name")
                  existing_item["author"] = author or existing_item.get("author")
                  existing_item["category"] = category or existing_item.get("category")
                  existing_item["description"] = description or existing_item.get("description")
                  existing_item["version"] = version  # En güncel sürüm
                  existing_item["download_url"] = download_url
                  
                  # Sürüm listesi yönetimi
                  versions = existing_item.get("versions", [])
                  # Eski aynı versiyon varsa güncelle, yoksa başa ekle
                  versions = [v for v in versions if v.get("version") != version]
                  versions.insert(0, {"version": version, "download_url": download_url})
                  existing_item["versions"] = versions
                  action_result = f"🚀 '{plugin_id}' modülüne yeni v{version} sürümü eklendi!"
              else:
                  new_item = {
                      "id": plugin_id,
                      "name": name or plugin_id,
                      "version": version,
                      "author": author,
                      "category": category,
                      "description": description,
                      "download_url": download_url,
                      "versions": [{"version": version, "download_url": download_url}]
                  }
                  catalog.append(new_item)
                  action_result = f"🎉 Yeni modül '{plugin_id}' (v{version}) markete eklendi!"

          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(catalog, f, indent=2, ensure_ascii=False)

          with open("action_msg.txt", "w", encoding="utf-8") as f:
              f.write(action_result)
          EOF
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Auto: Catalog update / remove" || echo "Değişiklik yok"
          git push

      - name: Issue'yu Kapat ve Bilgilendir
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const msg = fs.readFileSync('action_msg.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg + "\n\n*İşlem tamamlandı, talep kapatılıyor.*"
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed"
            });
